name: Verification VULCAIN Python et Lean 4

on:
  push:
    branches:
      - main

jobs:
  python-tests:
    name: Tests Unitaires Python (VULCAIN)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install pytest numpy
          pytest -v
          python vulcain_v5_complete.py

  lean-proofs:
    name: Verification Formelle Lean 4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: false
      - run: |
          lake update
          lake exe cache get
          lake build
